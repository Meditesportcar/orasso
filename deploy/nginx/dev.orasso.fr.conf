# =============================================================================
#  ORASSO — dev.orasso.fr (version de test)
#  Conteneurs Docker orasso-web (127.0.0.1:3210) et orasso-api (127.0.0.1:3211).
#  Source : dépôt Orasso, deploy/nginx/dev.orasso.fr.conf (installé par deploy/setup-nginx.sh).
#  Certificat Let's Encrypt (certbot, webroot /var/www/html, deploy-hook reload nginx).
#  Pas de snippets/supervision.conf : il réserve /api/send et /api/<n>/envelope, qui sont dans
#  l'espace de l'API Orasso ; Orasso aura son propre SDK Sentry pointé sur GlitchTip.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name dev.orasso.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.orasso.fr;

    ssl_certificate     /etc/letsencrypt/live/dev.orasso.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.orasso.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Version de test : pas d'indexation, accès au site protégé par mot de passe.
    add_header X-Robots-Tag "noindex, nofollow" always;
    auth_basic "Orasso - version de test";
    auth_basic_user_file /etc/nginx/orasso-dev.htpasswd;

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # API : sans mot de passe nginx (l'appli l'appelle directement ; l'API a sa propre authentification).
    # Envoi de photos (jusqu'à 8 par véhicule) : 80 Mo par requête.
    location /api/ {
        auth_basic off;
        client_max_body_size 80M;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Temps réel (WebSocket).
    location /api/ws {
        auth_basic off;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Site (rendu serveur).
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
