# =============================================================================
#  ORASSO — dev.orasso.fr (version de test)
#  Conteneurs Docker orasso-web (127.0.0.1:3210) et orasso-api (127.0.0.1:3211).
#  Source : dépôt Orasso, deploy/nginx/dev.orasso.fr.conf (installé par deploy/setup-nginx.sh).
#  Certificat Let's Encrypt (certbot, webroot /var/www/html, deploy-hook reload nginx).
#  Pas de snippets/supervision.conf : il réserve /api/send et /api/<n>/envelope, qui sont dans
#  l'espace de l'API Orasso ; Orasso aura son propre SDK Sentry pointé sur GlitchTip.
# =============================================================================

# Contexte http (ce fichier est inclus depuis sites-enabled) : noms préfixés « orasso_ ».
# Débit par adresse IP sur l'API (ouverte sans mot de passe nginx).
limit_req_zone $binary_remote_addr zone=orasso_dev_api:10m rate=30r/s;
# Connexions WebSocket simultanées par adresse IP (lot 18) ; l'API en garde en plus 5 au plus par compte.
limit_conn_zone $binary_remote_addr zone=orasso_dev_ws:10m;
# Le mot de passe du site (Basic) n'est pas transmis à l'API ; un jeton (Bearer) le serait.
map $http_authorization $orasso_dev_api_authorization {
    ~*^Basic  "";
    default   $http_authorization;
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.orasso.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.orasso.fr;

    ssl_certificate     /etc/letsencrypt/live/dev.orasso.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.orasso.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Version de test : pas d'indexation, accès au site protégé par mot de passe.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    auth_basic "Orasso - version de test";
    auth_basic_user_file /etc/nginx/orasso-dev.htpasswd;

    # Une photo par requête (≤ 15 Mo, ARCHITECTURE.md) ; le reste de l'API n'a pas besoin de plus.
    client_max_body_size 16M;

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Liens de l'appli (lot 36) : Android et iOS lisent ces fichiers sans mot de passe ni redirection. Servis par le site.
    location /.well-known/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API : sans mot de passe nginx (l'appli l'appelle directement ; l'API a sa propre authentification).
    # X-Forwarded-For = adresse réelle seulement (sinon un client contournerait la limite de débit de Better Auth).
    location /api/ {
        auth_basic off;
        limit_req zone=orasso_dev_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $orasso_dev_api_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Photos de véhicule (jusqu'à 8 de 15 Mo dans un même envoi) : seule route à 128 Mo.
    location ~ ^/api/me/vehicles/[^/]+/photos$ {
        auth_basic off;
        limit_req zone=orasso_dev_api burst=60 nodelay;
        limit_req_status 429;
        client_max_body_size 128M;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $orasso_dev_api_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Temps réel (WebSocket).
    location /api/ws {
        auth_basic off;
        limit_conn orasso_dev_ws 20;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $orasso_dev_api_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Site (rendu serveur).
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
