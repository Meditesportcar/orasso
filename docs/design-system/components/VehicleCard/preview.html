<!-- @dsCard group="Cartes" height=330 subtitle="Véhicule du garage (une plaque dans les deux thèmes), vignette d'événement" -->
<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,100,400;0,125,900;1,125,900&family=Archivo+Narrow:wght@700&display=swap">
<style>
body{margin:0;padding:20px;background:var(--ground);font-family:var(--font-sans);display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.card{width:340px;background:var(--plate,var(--surface));color:var(--plate-ink,var(--ink));border:1px solid var(--plate-edge,transparent);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);overflow:hidden;position:relative}
.photo{height:160px;position:relative;background:radial-gradient(ellipse at 30% 30%,#4a4232 0,#24211c 60%,#17181b 100%)}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,var(--photo-fade) 100%)}
.tag{position:absolute;top:10px;left:12px;z-index:1;font-family:var(--font-narrow);font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--poster);color:var(--poster-ink);padding:3px 8px;border-radius:4px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.title{font-family:var(--font-display);font-stretch:125%;font-style:italic;font-weight:900;font-size:16px;line-height:18px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.title small{font-family:var(--font-narrow);font-style:normal;font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--plate-muted,var(--ink-muted))}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--font-narrow);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:var(--radius-pill);border:1.5px solid var(--plate-chip,var(--line))}
.chip.a{border-color:var(--accent);color:var(--accent)}
.meta{font-size:13px;color:var(--plate-muted,var(--ink-muted))}
.thumb{width:150px}
.thumb .ph{height:84px;border-radius:var(--radius-md);background:radial-gradient(ellipse at 30% 30%,#4a4232 0,#24211c 60%,#17181b 100%);clip-path:polygon(0 0,100% 10%,100% 100%,0 90%)}
.thumb .t{font-family:var(--font-display);font-stretch:125%;font-style:italic;font-weight:900;font-size:13px;text-transform:uppercase;margin-top:6px;color:var(--ink)}
.thumb .m{font-family:var(--font-narrow);font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
</style></head>
<body>
<article class="card">
  <div class="photo"><span class="tag">Certifié</span></div>
  <div class="body">
    <div class="title">Nissan 200SX S14 <small>1996 · 250 ch</small></div>
    <div class="chips"><span class="chip a">JDM</span><span class="chip">Youngtimer</span><span class="chip">Préparée</span></div>
    <div class="meta">8 événements · dernier : Nocturne de Canet</div>
  </div>
</article>
<div class="thumb"><div class="ph"></div><div class="t">Expo Rivesaltes</div><div class="m">Dim 25 oct · 12 km · 40 pl.</div></div>
</body></html>
