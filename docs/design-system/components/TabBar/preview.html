<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,100,400;0,100,600;0,100,800;0,125,900;1,125,900&family=Archivo+Narrow:wght@700&display=swap">
<style>
body{margin:0;padding:24px 0 0;background:var(--ground);font-family:var(--font-display)}
.tabs{width:390px;margin:0 auto;position:relative;isolation:isolate;overflow:hidden;height:80px;display:flex;background:var(--bar-gradient,linear-gradient(180deg,#131418 0%,#08090b 55%,#030304 100%));border-top:2px solid var(--accent);border-radius:0 0 30px 30px;box-shadow:var(--shadow-bar-bottom,0 -8px 24px rgba(0,0,0,.5));text-shadow:var(--emboss-bar,none)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-stretch:125%;font-weight:900;font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--bar-muted,#afa89c);text-decoration:none}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--bar-ink,#f3ebdd)}
.tab.c{background:var(--accent);color:var(--accent-ink);margin:-16px 6px 12px;border-radius:18px;transform:skewX(var(--skew-tab,-6deg));box-shadow:var(--neon-accent);text-shadow:none}
.tab.c span{display:block;transform:skewX(6deg)}
.dot{position:relative}.dot b{position:absolute;top:16px;right:22px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:var(--neon-accent-soft)}
</style></head>
